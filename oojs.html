<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>OOJS összeadás és megszámolás</title>
  <link rel="stylesheet" href="Assets/Styles/header-footer.css">
  <link rel="stylesheet" href="Assets/Styles/main.css">
  <style>
    body { font-family: sans-serif; padding: 1em; }
    .someitem, .something-thingamabob { margin-bottom: 0.5em; }
    .something { margin-top: 1em; border-top: 1px solid #aaa; padding-top: 1em; }
    button { padding: 5px 10px; margin-right: 5px; }
    .container{padding: 50px;}
  </style>
</head>
<body>
    <header>
        <h1>OOJS - összead és számol</h1>
      
      
        <nav>
          <ul>
              <a href="index.html">Főoldal</a>
              <a href="html5.html">HTML 5</a>
              <a href="table.html">CRUD</a>
              <a href="ajax.html">AJAX</a>
              <a class="active"  href="oojs.html">OOJS</a>
              <a href="REACT/index.html">REACT</a>
          </ul>
      </nav>
      </header>
<div class="container">


</div>
  <h2>Elemek</h2>
  <div id="someitem-list"></div>
  <div class="something" id="something-display"></div>

  <script>
    class Someitem {
      constructor(name, value) {
        this.name = name;
        this.value = value;
      }
    }

    class SomethingItem {
      constructor(someitem, amount = 1) {
        this.someitem = someitem;
        this.amount = amount;
      }

      getTotal() {
        return this.someitem.value * this.amount;
      }
    }

    class Something {
      constructor() {
        this.items = [];
      }

      addSomeitem(someitem) {
        const existing = this.items.find(item => item.someitem.name === someitem.name);
        if (existing) {
          existing.amount++;
        } else {
          this.items.push(new SomethingItem(someitem));
        }
        this.render();
      }

      clearSomething() {
        this.items = [];
        this.render();
      }

      render() {
        const display = document.getElementById('something-display');
        display.innerHTML = "<h2>Kiválaszott elemek:</h2>";

        if (this.items.length === 0) {
          display.innerHTML += "<p>Nincs elem kiválasztva.</p>";
          return;
        }

        this.items.forEach(item => {
          const p = document.createElement("p");
          p.className = "something-thingamabob";
          p.textContent = `${item.someitem.name} (${item.amount} db) – ${item.getTotal()} `;
          display.appendChild(p);
        });

        const total = this.items.reduce((sum, item) => sum + item.getTotal(), 0);
        const totalP = document.createElement("p");
        totalP.innerHTML = `<strong>Elemek értéke: ${total} </strong>`;
        display.appendChild(totalP);

        const clearBtn = document.createElement("button");
        clearBtn.textContent = " törlés";
        clearBtn.onclick = () => this.clearSomething();
        display.appendChild(clearBtn);
      }
    }

    const something = new Something();

    const someitems = [
      new Someitem("Első elem", 10),
      new Someitem("Második elem", 20),
      new Someitem("Harmadik elem", 50),
      new Someitem("Negyedik elem", 100),
      new Someitem("Ötödik elem", 200),
      new Someitem("Hatodik elem", 500)
    ];

    const list = document.getElementById("someitem-list");
    someitems.forEach(someitem => {
      const btn = document.createElement("button");
      btn.textContent = `+ ${someitem.name} (${someitem.value} )`;
      btn.onclick = () => something.addSomeitem(someitem);
      const div = document.createElement("div");
      div.className = "someitem";
      div.appendChild(btn);
      list.appendChild(div);
    });
  </script>
</body>
</html>
